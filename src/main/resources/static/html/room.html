<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find the perfect student housing for your needs.">
  <title>Luxury Housing Finder</title>

  <link rel="stylesheet" href="../css/room.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>

<body>
<!--Header  -->
<header class="header">
  <div class="container">
    <div class="logo">
      <h1><i class="fas fa-bed"></i> Rooms </h1>
    </div>
    <nav class="navbar">
      <ul>
        <li><a href="index.html"><i class="fas fa-home"></i> Home</a></li>
        <li><a href="room.html"><i class="fas fa-bed"></i> Rooms</a></li>
        <li><a href="apply.html"><i class="fas fa-file-alt"></i> Apply</a></li>
      </ul>
    </nav>
  </div>
</header>

<!--Hero -->
<section class="hero">
  <h2>Find Your Perfect Room</h2>
  <p>Search, compare, and apply for the best student accommodations.</p>

  <!-- Filters Moved into Hero -->
  <div class="filter-section">
    <label for="search">🔍 Search by location:</label>
    <input type="text" id="search" placeholder="Enter City">

    <label for="furnished">🛏️ Furnished:</label>
    <input type="checkbox" id="furnished">

    <label for="bills-included">💡 Bills Included:</label>
    <input type="checkbox" id="bills-included">

    <button onclick="applyFilters()">Apply Filters</button>
  </div>
</section>

<!-- Room Listings -->
<section class="rooms">
  <div id="room-list" class="room-list">
    <p>Loading rooms...</p>
  </div>
</section>


<!-- Footer -->
<footer class="footer">
  <p>&copy; COMP30231 Global Dorm Booking App. All rights reserved. Designed by <strong>Jaynie Akogwu</strong>.</p>
</footer>

<script src="../js/room.js"></script>
</body>
</html>
