<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find the perfect student housing for your needs.">
  <title>Luxury Housing Finder</title>

  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <style>
    /* Room Listing Container */
    .room-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); /* Auto adjusts for different screen sizes */
      gap: 40px; /* Increase space between cards */
      padding: 20px;
      justify-content: center;
      max-width: 1200px;
      margin: auto; /* Center the grid */
    }

    /* Room Cards */
    .room-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      transition: transform 0.2s ease-in-out;
      width: 100%;
      max-width: 400px; /* Slightly larger cards */
      text-align: left;
      margin: auto; /* Centers the card */
    }

    /* Hover Effect */
    .room-card:hover {
      transform: scale(1.05);
    }

    /* Room Image */
    .room-card img {
      width: 100%;
      height: 220px; /* Slightly taller images */
      object-fit: cover;
      border-radius: 12px 12px 0 0;
    }

    /* Room Card Content */
    .room-card-content {
      padding: 20px;
    }

    /* Room Title */
    .room-card h3 {
      font-size: 22px;
      color: #ff69b4;
      margin-bottom: 10px;
    }

    /* Room Details */
    .room-card p {
      font-size: 16px;
      color: #5a5a5a;
      margin-bottom: 8px;
    }

    /* Make Icons & Text More Visible */
    .room-card p i {
      margin-right: 5px;
      color: #e75a7c;
      font-size: 18px;
    }

    /* Ensure text spacing is good */
    .room-card p:last-child {
      margin-bottom: 0;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .room-list {
        grid-template-columns: 1fr; /* Single column on smaller screens */
      }
      .room-card {
        max-width: 90%; /* Adjust for smaller screens */
      }
    }
  </style>
</head>

<body>
<!--Header  -->
<header class="header">
  <div class="container">
    <div class="logo">
      <h1><i class="fas fa-home"></i> Homes by Jaynie</h1>
    </div>
    <nav class="navbar">
      <ul>
        <li><a href="index.html">🏠 Home</a></li>
        <li><a href="room.html">🛏️ Rooms</a></li>
        <li><a href="apply.html">✅  Apply</a></li>
      </ul>
    </nav>
  </div>
</header>

<!--Hero -->
<!-- Hero Section -->
<section class="hero" id="home">
  <div class="container">
    <div class="hero-banner">
      <h1>Find Your Perfect Room</h1>
      <p>Search, compare, and apply for the best student accommodations.</p>
    </div>
  </div>
</section>

<!-- Filter Bar -->
<section class="filter-bar">
  <input type="text" id="search" placeholder="🔍 Search by location or name...">
  <input type="number" id="price-range" placeholder="💰 Max Price (GBP)">
  <label><input type="checkbox" id="furnished"> Furnished</label>
  <label><input type="checkbox" id="bills-included"> Bills Included</label>
  <button onclick="applyFilters()">🔄 Apply Filters</button>
</section>

<!-- Room Listings -->
<section class="rooms">
  <h2>Available Rooms</h2>
  <div id="room-list" class="room-list">
    <p>Loading rooms...</p>
  </div>
</section>


<!-- Footer -->
<footer class="footer">
  <p>&copy; COMP30231 Global Dorm Booking App. All rights reserved. Designed by <strong>Jaynie Akogwu</strong>.</p>
</footer>

<script src="../js/room.js"></script>
</body>
</html>
