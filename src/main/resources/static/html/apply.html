<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Find the perfect student housing for your needs.">
    <title>Homes by Jaynie</title>

    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>

        /* Search Box */
        .search-box {
            text-align: center;
            margin: 20px 0;
        }

        .search-box input {
            padding: 10px;
            width: 250px;
            border: 2px solid #ffb6c1;
            border-radius: 5px;
            margin-right: 10px;
        }

        .search-box button {
            padding: 10px 15px;
            border: none;
            background: #ff6699;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        .search-box button:hover {
            background: #ff4d88;
        }

        /* Application List */
        .application-list {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }

        .application-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
            border: 2px solid #ffb6c1;
        }

        .cancel-button {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .cancel-button:hover {
            background: #cc0000;
        }
    </style>
</head>

<body>
<!--Header  -->
<header class="header">
    <div class="container">
        <div class="logo">
            <h1>📋 My Room Applications</h1>
        </div>
        <nav class="navbar">
            <ul>
                <li><a href="index.html">🏠 Home</a></li>
                <li><a href="room.html">🛏️ Rooms</a></li>
                <li><a href="apply.html">✅ Apply</a></li>
            </ul>
        </nav>
    </div>
</header>

<section class="applications">
    <h2>Enter Your User ID to View Applications</h2>

    <!-- Search form -->
    <div class="search-box">
        <input type="text" id="userId" placeholder="Enter your User ID">
        <button id="searchApplication">Search</button>
    </div>

    <div id="application-list" class="application-list">
        <p>Search to see your applications.</p>
    </div>
</section>


<!-- Footer -->
<footer class="footer">
    <p>&copy; COMP30231 Global Dorm Booking App. All rights reserved. Designed by <strong>Jaynie Akogwu</strong>.</p>
</footer>

<script src="../js/apply.js"></script>
</body>
</html>
